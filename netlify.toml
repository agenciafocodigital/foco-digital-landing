[build]
  # Sitio estático: no hay nada que compilar. Este comando tiene prioridad sobre el del panel de Netlify.
  command = "echo Sitio estatico listo"
  publish = "site"

# URL anteriores → URL nuevas (22/11/2026)
[[redirects]]
  from = "/diagnostico/*"
  to = "/diagnostico-gratuito/"
  status = 301

[[redirects]]
  from = "/auditoria/*"
  to = "/diagnostico-gratuito/"
  status = 301

[[redirects]]
  from = "/agencia/*"
  to = "/nosotros/"
  status = 301

[[redirects]]
  from = "/inversion/*"
  to = "/servicios/"
  status = 301

[[redirects]]
  from = "/aviso-de-privacidad"
  to = "/privacidad/"
  status = 301

[[redirects]]
  from = "/servicios/marketing"
  to = "/servicios/redes-sociales-google/"
  status = 301

[[redirects]]
  from = "/servicios/automatizacion"
  to = "/servicios/asistente-whatsapp-ia/"
  status = 301

[[redirects]]
  from = "/servicios/marketing/*"
  to = "/servicios/redes-sociales-google/:splat"
  status = 301

[[redirects]]
  from = "/servicios/automatizacion/*"
  to = "/servicios/asistente-whatsapp-ia/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
