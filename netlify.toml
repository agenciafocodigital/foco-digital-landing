[build]
  publish = "site"

# URL anteriores → URL nuevas (22/11/2026)
[[redirects]]
  from = "/diagnostico/*"
  to = "/diagnostico-gratuito/"
  status = 301

[[redirects]]
  from = "/auditoria/*"
  to = "/diagnostico-gratuito/"
  status = 301

[[redirects]]
  from = "/agencia/*"
  to = "/nosotros/"
  status = 301

[[redirects]]
  from = "/inversion/*"
  to = "/servicios/"
  status = 301

[[redirects]]
  from = "/aviso-de-privacidad"
  to = "/privacidad/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/404/index.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
